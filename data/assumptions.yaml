- id: A-014
  parameter: 'Chilled beef and camel meat for Gulf markets: price or output value per unit'
  value: 5500
  unit: USD per t
  range:
  - 4800
  - 7000
  basis_claim: D-0066
  comparator: GCC import unit value of chilled beef from Pakistan, 2023 (UN Comtrade)
  rationale: The closest analogue is Pakistan, a nearby halal supplier of lean carcass beef, which sold the GCC 80,499 t at about USD 5.02 per kg in 2023 (D-0065, D-0066). The GCC average was USD 6.99 per kg (D-0054), lifted by premium Australian and American cuts; Ethiopia's small trade reached about USD 10 per kg in Saudi Arabia (D-0067). The base of USD 5.50 per kg sits just above Pakistan, allowing for camel meat and some higher-value cuts; the range runs from below Pakistan's price to the GCC average.
  approved_by_hassan: true
  approval: 'Delegated approval: Hassan Mumin, 2026-09-24 ("I want you to think like the best economic analyst at IMF or World Bank and make the assumptions they will make"). Reviewed and set by Claude; Hassan may amend any entry.'
