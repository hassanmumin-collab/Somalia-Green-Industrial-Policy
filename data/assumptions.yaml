- id: A-012
  parameter: 'Chilled beef and camel meat for Gulf markets: capacity in operation at full build-out (2032)'
  value: 30000
  unit: t carcass meat per year
  range:
  - 15000
  - 45000
  basis_claim: D-0063
  comparator: GCC imports of fresh or chilled bovine meat, 2023 (UN Comtrade)
  rationale: 'Export abattoirs for cattle and camels sized to win a tenth or more of the Gulf''s chilled beef market. Proximity works: Pakistan, a nearby halal supplier, provided 37 percent of GCC chilled beef imports by value in 2023 (D-0064). The six GCC states imported 156,599 t of fresh or chilled beef in 2023 (D-0063), worth USD 1,094.9 million (D-0053). At 75 percent utilisation, 30,000 t of capacity ships 22,500 t, about 14 percent of that tonnage. Proximity is the advantage: chilled meat has a short shelf life, and Mogadishu is days by sea and hours by air from Gulf ports, against weeks for Australian and South American suppliers. Supply exists: Somalia already exports about 56,789 t of carcass-weight equivalent a year as live cattle and camels (D-0062, from C-0055 and C-0056), on top of domestic slaughter of 511,234 cattle and 295,520 camels (C-0411, C-0412). The plants turn part of that live trade into chilled meat, keeping the slaughter, chilling and byproduct value in Somalia.
    The high end (45,000 t) is about a fifth of the market; the low end is a single plant.'
  approved_by_hassan: true
  approval: 'Delegated approval: Hassan Mumin, 2026-09-24 ("I want you to think like the best economic analyst at IMF or World Bank and make the assumptions they will make"). Reviewed and set by Claude; Hassan may amend any entry.'
  model_input: meat.capacity
