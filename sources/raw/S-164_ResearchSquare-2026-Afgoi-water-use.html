pe="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-flex tw-items-center"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Status:</h3><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-ml-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-color-gray-800">Posted</p></div></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><h2>Background</h2> <p>Agricultural water productivity in Somalia is critically low, limiting food security under variable climatic conditions. Field-level data on water use efficiency (WUE) are scarce, constraining evidence-based irrigation policy.</p><h2>Objective</h2> <p>This study evaluated agricultural water productivity in the Afgoi irrigation district of the Lower Shabelle region, Somalia, for five economically important crops: maize, sorghum, sesame, tomato, and banana.</p><h2>Methods</h2> <p>A field survey was conducted on 47 randomly selected farm plots between August and December 2021 (2&deg;8&prime;17&Prime;N, 45&deg;7&prime;16&Prime;E; elevation 83 m a.s.l.). Crop yields were obtained through structured farmer interviews; the volume of irrigation water applied was measured using flow meters attached to pump outlets. Seasonal crop evapotranspiration (ETc) and irrigation requirements were computed using the FAO CROPWAT 8.0 model with long-term climate data (1990&ndash;2021). WUE and irrigation water use efficiency (IWUE) were calculated as yield per unit of ETc and per unit of applied irrigation water, respectively.</p><h2>Key Findings:</h2> <p>Mean yields ranged from 471.3 kg ha⁻&sup1; (sesame) to 17,574.1 kg ha⁻&sup1; (banana) well below FAO global benchmarks. Farmers over-applied irrigation water for maize, sesame, tomato, and banana (58&ndash;127% above CROPWAT estimates), while sorghum was under-irrigated. WUE ranged from 0.14 (sesame) to 1.97 kg m⁻&sup3; (banana); IWUE from 0.12 (sesame) to 1.40 kg m⁻&sup3; (banana). All values fell substantially below international benchmarks, driven by uncontrolled surface irrigation, earthen-canal conveyance losses, and absent irrigation scheduling.</p><h2>Conclusion</h2> <p>Demand-driven pressurized irrigation, combined with farmer training and improved inputs, is needed to enhance water productivity and food security in Somalia. These findings establish an empirical baseline for irrigation policy reform.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">water productivity</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">irrigation efficiency</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">CROPWAT</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">water use efficiency</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">climate-smart irrigation</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">food security</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Somalia</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">semi-arid agriculture</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">1. INTRODUCTION</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Efficient irrigation management is central to food security in water-scarce regions. Agriculture accounts for approximately 70% of global freshwater withdrawals, and improving agricultural water productivity is increasingly urgent as climate variability intensifies (Teweldebrihan &amp; Olum, 2025).</p> <p>In East Africa, these pressures are compounded by persistent climate variability and fragile institutional frameworks; the region irrigates less than 2% of its cultivated area sustainably, against a global average of approximately 20% (Teweldebrihan &amp; Olum, 2025). Somalia represents an especially acute case.</p> <p>Somalia is classified as predominantly arid to semi-arid, with mean annual rainfall of approximately 582 mm concentrated in two rainy seasons (Gu: April&ndash;June; Deyr: September&ndash;November) that are notoriously erratic and subject to El Ni&ntilde;o&ndash;Southern Oscillation (ENSO)-related variability (Venema &amp; Vargas, 2007). Historically, the alluvial plains of the Jubba and Shabelle Rivers supported over 220,000 ha of irrigated and recession agriculture, producing export-quality bananas, rice, sesame, and sugarcane (Sandstr&ouml;m, 2021). The collapse of central government in 1990 caused catastrophic degradation of irrigation infrastructure: all major barrages on the Shabelle and Jubba rivers ceased to function, irrigation canals fell into disrepair, and irrigated area contracted sharply. Three decades of conflict, compounded by recurring droughts and floods associated with climate change, have further eroded agricultural capacity (FAOSWALIM, 2020).</p> <p>Despite growing recognition of Somalia's irrigation rehabilitation potential particularly along the Lower Shabelle, described as the 'breadbasket of Somalia' rigorous field-level data on actual water use, crop yields, and water productivity remain almost entirely absent from the scientific literature. The few existing assessments are desk-based or rely on remote sensing (Oduori et al., 2012; Sandstr&ouml;m, 2021), with virtually no peer-reviewed studies measuring on-farm WUE and IWUE through direct flow monitoring and CROPWAT analysis in the Somali context.</p> <div id="Sec2" class="Section2"> <h2>1.1 Research Gap and Study Novelty</h2> <p>The absence of field-calibrated water productivity benchmarks for Somali irrigated agriculture constitutes a critical evidence gap that impedes rational investment in irrigation rehabilitation, climate-adaptation planning, and agricultural extension. Previous regional studies either focus on Jubba or Shabelle basin hydrology at a macro-scale (Basnyat, 2007; FAOSWALIM, 2020) or rely on modelled estimates rather than measured on-farm data. No published study to date has simultaneously measured farmer-applied irrigation water using flow meters, estimated CROPWAT-based crop water requirements under Somali climatic conditions, and computed WUE and IWUE for multiple crops across a field-based sample of farm plots in the Lower Shabelle region.</p> <p>This study addresses that gap by providing a multi-crop, field-measured assessment of agricultural water productivity in the Afgoi irrigation district a key production zone approximately 30 km southwest of Mogadishu. The findings are contextualized against pre-war Somali records, neighboring East African countries (Ethiopia, Kenya), and global FAO benchmarks to quantify the magnitude of the productivity deficit and identify priority intervention pathways.</p> </div> <div id="Sec3" class="Section2"> <h2>1.2 Research Objectives</h2> <p>The specific objectives of this study were:</p> <p> <ol> <span>  <li> <p>To measure seasonal crop yields for five major irrigated crops (maize, sorghum, sesame, tomato, and banana) in the Afgoi district through a structured farm-level survey.</p> </li> </span> <span>  <li> <p>To quantify actual irrigation water applied by farmers using in-situ flow meters and to estimate crop water requirements and irrigation scheduling using the FAO CROPWAT 8.0 model.</p> </li> </span> <span>  <li> <p>To calculate WUE and IWUE for each crop and compare results with international benchmarks and neighboring countries.</p> </li> </span> <span>  <li> <p>To identify key constraints to agricultural water productivity and formulate evidence-based recommendations for irrigation improvement and climate-adaptive water management in Somalia.</p> </li> </span> </ol> </p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">2. LITERATURE REVIEW</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec5" class="Section2"> <h2>2.1 Concepts of Agricultural Water Productivity</h2> <p>Water productivity (WP) in agriculture refers to the ratio of economic output to the water input used in its production. Two metrics are conventionally used: water use efficiency (WUE), which relates crop yield (kg ha⁻&sup1;) to seasonal crop evapotranspiration or ETc (mm), and irrigation water use efficiency (IWUE), which relates yield to the volume of irrigation water actually applied by the farmer (Jomaa &amp; Shaban, 2018; Howell, 2003). WUE and IWUE are expressed in kg m⁻&sup3;. Enhancing both metrics is essential in water-scarce environments, since it allows the same food output to be produced with less water, reducing competition between agricultural and domestic or industrial users (Howell, 2003)</p> <p>Irrigation efficiency, a related concept, captures the ratio of water reaching the crop root zone to water diverted from the source (Howell, 2003). Surface irrigation methods flood, furrow, and basin typically achieve application efficiencies of 50&ndash;60% under field conditions in developing countries, compared with 75&ndash;85% for sprinkler systems and 88&ndash;95% for well-designed drip systems (Brouwer &amp; Heibloem, 1986). FAO estimated Somalia's overall irrigation efficiency at approximately 40% in 2010, indicating major losses in conveyance, distribution, and field application (FAO, 2010).</p> </div> <div id="Sec6" class="Section2"> <h2>2.2 Water Productivity of Major Irrigated Crops</h2> <p>Global databases and field experiments provide robust WUE benchmarks for the crops studied here. For maize, FAO (2020) reports WUE values of 0.8&ndash;1.6 kg m⁻&sup3; under conventional irrigation globally. Allen et al. (2021) documented WUE of 1.76&ndash;2.71 kg m⁻&sup3; in the United States under optimized management. Zwart and Bastiaanssen (2004), in a global review of 84 studies, reported a median maize WUE of 1.80 kg m⁻&sup3; (range: 0.3&ndash;2.7 kg m⁻&sup3;). These benchmarks illustrate the large gap between internationally achievable performance and the Somali values reported in the present study.</p> <p>For sorghum, FAO (2020) reports a seasonal water requirement of 450&ndash;650 mm, yields of 3.5&ndash;5.0 t ha⁻&sup1;, and WUE of 0.6&ndash;1.0 kg m⁻&sup3;. Tolk and Howell (2021) measured sorghum WUE of 1.47&ndash;1.52 kg m⁻&sup3; in the USA.</p> <p>Sesame is drought-tolerant, with a seasonal water requirement of 430&ndash;470 mm and WUE of 0.28&ndash;0.32 kg m⁻&sup3; (FAO, 2020). Tomato has potential yields of 45&ndash;65 t ha⁻&sup1; and WUE up to 10&ndash;12 kg m⁻&sup3; under well-managed irrigation; drip-irrigated tomato in Ethiopia achieved 4.2&ndash;5.8 kg m⁻&sup3; (Wondatir &amp; Belay, 2020). Banana requires 1,200&ndash;2,200 mm seasonally and yields 40&ndash;60 t ha⁻&sup1; with WUE of 2.5&ndash;4.0 kg m⁻&sup3; (FAO, 2020).</p> </div> <div id="Sec7" class="Section2"> <h2>2.3 Irrigation Water Management in Somalia and East Africa</h2> <p>Historical records indicate that the Jubba and Shabelle basins sustained irrigated production across more than 220,000 ha before 1990 (Sandstr&ouml;m, 2021). Irrigation water requirements in the Shabelle basin were estimated at approximately 11,400 m&sup3; ha⁻&sup1; per season (0.36 l s⁻&sup1; ha⁻&sup1;), assuming 65% field application efficiency (Basnyat, 2007). Post-conflict assessments document the near-total collapse of infrastructure: all eight Shabelle barrages are non-functional, main canals are heavily silted, and farmers rely predominantly on diesel-powered pump systems drawing directly from the river (FAOSWALIM, 2020).</p> <p>Somalia's irrigation sector is further constrained by three decades of institutional collapse, ongoing insecurity, and a near-total absence of functioning water control infrastructure. These conditions collectively explain the low productivity baseline documented in the present study.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">3. MATERIALS AND METHODS</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec9" class="Section2"> <h2>3.1 Study Area</h2> <p>The study was conducted in the Afgoi irrigation district, Lower Shabelle (Shabeellaha Hoose) Region, southwestern Somalia, approximately 30 km southwest of Mogadishu (centroid coordinates: 2&deg;8&prime;17&Prime;N, 45&deg;7&prime;16&Prime;E; elevation 83 m above mean sea level) (Venema &amp; Vargas, 2007). The district has a total population of approximately 79,400, of whom approximately 33,000 are engaged in farming. Total cultivated area in the district is 235,242 ha, comprising 121,590 ha of rainfed agriculture and 113,652 ha of irrigated agriculture (Oduori et al., 2012). The irrigated area is supplied by diesel-powered pumps extracting from the Shabelle River; no major functioning barrage or controlled distribution network currently exists (FAOSWALIM, 2020).</p> <p>Soils are predominantly dark, clay-rich alluvial Vertisols with high water-holding capacity, moderate to poor drainage, and elevated salt content in some areas proximal to the river conditions that can reduce irrigation efficiency and negatively affect crop yields if drainage is not managed adequately (Hadden, 2007). The study area has a terrain slope of 0&ndash;4%, consistent with flood-prone alluvial lowlands and well suited to surface irrigation technologies.</p> </div> <div id="Sec10" class="Section2"> <h2>3.2 Climate of the Study Area</h2> <p>Somalia's climate is classified as arid to semi-arid (K&ouml;ppen&ndash;Geiger: BWh/BSh), characterized by high temperatures, low and highly variable rainfall, and two distinct rainy seasons. Long-term climate data (1990&ndash;2021) from FAO's CLIMWAT database were used in CROPWAT calculations and are summarized in Table&nbsp;<span refid="Tab1" class="InternalRef">1</span>. Mean annual rainfall in the study area is approximately 582 mm, concentrated in the Gu (April&ndash;June, ~&thinsp;249 mm) and Deyr (October&ndash;November, ~&thinsp;183 mm) seasons. Effective annual rainfall is approximately 511 mm. Mean daily maximum temperatures range from 30.5&deg;C (July) to 35.0&deg;C (March), with a long-term annual mean temperature of approximately 27&deg;C. Relative humidity ranges from 65% (January) to 79% (June). Wind speeds are highest during the Southwest Monsoon (June&ndash;August: 4.2&ndash;5.1 m s⁻&sup1;).</p> <p> <div class="gridtable"><table float="Yes" id="Tab1" border="1"> <caption language="En"> <div class="CaptionNumber">Table 1</div> <div class="CaptionContent"> <p>Long-term climate data for Afgoi district, Lower Shabelle, Somalia (FAO CLIMWAT, 1990&ndash;2021)</p> </div> </caption> <colgroup cols="9"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <div align="left" class="colspec" colname="c5" colnum="5"></div> <div align="left" class="colspec" colname="c6" colnum="6"></div> <div align="left" class="colspec" colname="c7" colnum="7"></div> <div align="char" char="." class="colspec" colname="c8" colnum="8"></div> <div align="char" char="." class="colspec" colname="c9" colnum="9"></div> <thead> <tr> <th align="left" colname="c1"> <p> Month</p> </th> <th align="left" colname="c2"> <p>T_min (&deg;C)</p> </th> <t left" colname="c7"> <p>21.2</p> </td> <td align="char" char="." colname="c8"> <p>24.0</p> </td> <td align="char" char="." colname="c9"> <p>24.9</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Sep</p> </td> <td align="left" colname="c2"> <p>21.7</p> </td> <td align="left" colname="c3"> <p>32.0</p> </td> <td align="left" colname="c4"> <p>71.0</p> </td> <td align="left" colname="c5"> <p>3.6</p> </td> <td align="left" colname="c6"> <p>8.5</p> </td> <td align="left" colname="c7"> <p>22.5</p> </td> <td align="char" char="." colname="c8"> <p>15.0</p> </td> <td align="char" char="." colname="c9"> <p>14.6</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Oct</p> </td> <td align="left" colname="c2"> <p>22.0</p> </td> <td align="left" colname="c3"> <p>32.2</p> </td> <td align="left" colname="c4"> <p>72.0</p> </td> <td align="left" colname="c5"> <p>3.0</p> </td> <td align="left" colname="c6"> <p>7.5</p> </td> <td align="left" colname="c7"> <p>20.8</p> </td> <td align="char" char="." colname="c8"> <p>62.0</p> </td> <td align="char" char="." colname="c9"> <p>55.8</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Nov</p> </td> <td align="left" colname="c2"> <p>21.8</p> </td> <td align="left" colname="c3"> <p>32.3</p> </td> <td align="left" colname="c4"> <p>67.0</p> </td> <td align="left" colname="c5"> <p>2.8</p> </td> <td align="left" colname="c6"> <p>6.8</p> </td> <td align="left" colname="c7"> <p>19.0</p> </td> <td align="char" char="." colname="c8"> <p>121.0</p> </td> <td align="char" char="." colname="c9"> <p>97.6</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Dec</p> </td> <td align="left" colname="c2"> <p>21.6</p> </td> <td align="left" colname="c3"> <p>33.0</p> </td> <td align="left" colname="c4"> <p>66.0</p> </td> <td align="left" colname="c5"> <p>2.9</p> </td> <td align="left" colname="c6"> <p>6.6</p> </td> <td align="left" colname="c7"> <p>18.4</p> </td> <td align="char" char="." colname="c8"> <p>39.0</p> </td> <td align="char" char="." colname="c9"> <p>36.6</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Mean</b></p> </td> <td align="left" colname="c2"> <p><b>22.1</b></p> </td> <td align="left" colname="c3"> <p><b>32.3</b></p> </td> <td align="left" colname="c4"> <p><b>72.0</b></p> </td> <td align="left" colname="c5"> <p><b>3.5</b></p> </td> <td align="left" colname="c6"> <p><b>7.6</b></p> </td> <td align="left" colname="c7"> <p><b>20.5</b></p> </td> <td align="char" char="." colname="c8"> <p><b>48.7</b></p> </td> <td align="char" char="." colname="c9"> <p><b>42.6</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Annual</b></p> </td> <td align="left" colname="c2"> <p><b>&mdash;</b></p> </td> <td align="left" colname="c3"> <p><b>&mdash;</b></p> </td> <td align="left" colname="c4"> <p><b>&mdash;</b></p> </td> <td align="left" colname="c5"> <p><b>&mdash;</b></p> </td> <td align="left" colname="c6"> <p><b>&mdash;</b></p> </td> <td align="left" colname="c7"> <p><b>&mdash;</b></p> </td> <td align="char" char="." colname="c8"> <p><b>582.0</b></p> </td> <td align="char" char="." colname="c9"> <p><b>511.1</b></p> </td> </tr> </tbody> </colgroup> <tfoot> <tr><td colspan="9"><em>Note: T_min&thinsp;=&thinsp;minimum daily temperature; T_max&thinsp;=&thinsp;maximum daily temperature; RH&thinsp;=&thinsp;relative humidity; Eff. Rain&thinsp;=&thinsp;effective rainfall calculated using USDA Soil Conservation Service method. Data source: FAO CLIMWAT database.</em></td></tr> </tfoot> </table></div> </p> </div> <div id="Sec11" class="Section2"> <h2>3.3 Sampling Design and Data Collection</h2> <p>A total of 47 farm plots were selected using simple random sampling from the active irrigated plots registered in the district agricultural office database during the 2021 crop season. The sample included eight maize plots (Fields 1&ndash;8), ten sorghum plots (Fields 9&ndash;18), ten sesame plots (Fields 19&ndash;28), ten tomato plots (Fields 29&ndash;38), and nine banana plots (Fields 39&ndash;47). Sample size was determined primarily by resource availability and site accessibility; the 47-plot field-based multi-crop sample provides useful productivity estimates but has limited statistical power for subgroup analyses and cannot be extrapolated to the broader district without caution.</p> <p>Data collection was conducted between August and December 2021, covering the full growing seasons of all five crops. The following variables were recorded: (1) crop yield (kg ha⁻&sup1;), obtained through structured farmer interviews and cross-validated against plot-level harvested-area estimates; yield figures were triangulated by direct observation of harvested produce at three randomly selected plots per crop to check internal consistency; (2) total irrigation water applied per season (mm), measured using calibrated turbine flow meters (accuracy&thinsp;&plusmn;&thinsp;2%) attached to pump outlet pipes, with readings recorded at each irrigation event; and (3) irrigation scheduling (date, duration, and frequency of events). All field data were recorded in standardized datasheets, double-entered into Microsoft Excel, and checked for transcription errors prior to analysis. Enumerators received standardized training on measurement protocols before the survey.</p> </div> <div id="Sec12" class="Section2"> <h2>3.4 Estimation of Reference and Crop Evapotranspiration</h2> <p>Reference evapotranspiration (ETo) was estimated using the FAO-56 Penman&ndash;Monteith equation (Smith, 1992), which is the internationally recommended standard:</p> <p> <b>ETo = [0.408Δ(Rn&thinsp;&minus;&thinsp;G) + γ(900/(T&thinsp;+&thinsp;273))u₂(eₛ &minus; eₐ)] / [Δ&thinsp;+&thinsp;γ(1&thinsp;+&thinsp;0.34u₂)]</b> <div class="BlockQuote"> <p>where ETo is reference evapotranspiration (mm day⁻&sup1;); Rn is net radiation at the crop surface (MJ m⁻&sup2; day⁻&sup1;); G is soil heat flux density (MJ m⁻&sup2; day⁻&sup1;); T is mean daily air temperature at 2 m height (&deg;C); u₂ is wind speed at 2 m height (m s⁻&sup1;); eₛ is saturation vapour pressure (kPa); eₐ is actual vapour pressure (kPa); Δ is slope of the vapour pressure curve (kPa &deg;C⁻&sup1;); and γ is the psychrometric constant (kPa &deg;C⁻&sup1;).</p> </div> </p> <p>Crop evapotranspiration (ETc) was computed as ETc&thinsp;=&thinsp;ETo &times; Kc, where Kc is the crop coefficient varying by growth stage as defined by FAO-56 (Pruitt &amp; Doorenbos, 1977; Smith, 1992). All calculations were performed using FAO CROPWAT 8.0, with CLIMWAT long-term climate data for the study area as inputs. Effective rainfall was computed using the USDA Soil Conservation Service method within CROPWAT.</p> </div> <div id="Sec13" class="Section2"> <h2>3.5 Crop Water Requirement and Net Irrigation Requirement</h2> <p>Crop water requirement (CWR) was defined as the net depth of water (mm) needed to meet crop ETc after accounting for effective precipitation:</p> <p>CWR&thinsp;=&thinsp;ETc&thinsp;&minus;&thinsp;Reff (Eq.&nbsp;1)</p> <p>where Reff is effective rainfall (mm). Irrigation water requirement (IWR) was derived from CWR assuming a field application efficiency of 65% (corresponding to the FAO benchmark for gravity-fed surface irrigation in developing countries; FAO, 2010).</p> </div> <div id="Sec14" class="Section2"> <h2>3.6 Water Productivity Indices</h2> <p>WUE and IWUE were computed following standard formulations (Jomaa &amp; Shaban, 2018):</p> <p>WUE (kg m⁻&sup3;)&thinsp;=&thinsp;Y / ETc (Eq.&nbsp;2)</p> <p>IWUE (kg m⁻&sup3;)&thinsp;=&thinsp;Y / I_applied (Eq.&nbsp;3)</p> <p>where Y is crop yield (kg ha⁻&sup1;, converted to kg m⁻&sup2;&middot;mm⁻&sup1; for dimensional consistency), ETc is seasonal crop evapotranspiration (mm), and I_applied is the total depth of irrigation water applied by the farmer (mm). All mm values were converted to m&sup3; ha⁻&sup1; (1 mm&thinsp;=&thinsp;10 m&sup3; ha⁻&sup1;) for computation.</p> </div> <div id="Sec15" class="Section2"> <h2>3.7 Statistical Analysis</h2> <p>Descriptive statistics (mean, standard deviation, minimum, maximum, and coefficient of variation) were calculated for all variables. One-way analysis of variance (ANOVA) was performed to test for significant differences in WUE and IWUE across crop types (α&thinsp;=&thinsp;0.05). Where ANOVA indicated significant differences, Tukey's Honest Significant Difference (HSD) post-hoc test was applied for pairwise comparisons. Pearson correlation analysis was conducted to examine relationships between the volume of applied irrigation water and WUE/IWUE. All statistical analyses were performed using standard procedures in Microsoft Excel and verified by hand calculation.</p> </div> <div id="Sec16" class="Section2"> <h2>3.8 Study Limitations</h2> <p>The study is subject to several limitations. First, yield data were obtained through farmer interviews, which may be subject to recall bias and social desirability bias; harvest area estimates were cross-validated but not independently measured at the plot level. Second, the sample was limited to 47 plots due to security constraints and resource limitations, which restricts statistical power for some analyses. Third, CROPWAT ETc estimates are based on long-term average climate data rather than station data recorded during the 2021 study period, which may not fully capture intra-seasonal variability. Fourth, soil hydraulic properties (field capacity, permanent wilting point) were not measured in the field, so no soil moisture balance was computed. Fifth, the study covers a single agricultural season and cannot capture inter-annual variability in yields or water requirements. These limitations should be considered when extrapolating findings to other seasons or regions.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">4. RESULTS AND DISCUSSION</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec18" class="Section2"> <h2>4.1 Crop Yields and Comparison with International Benchmarks</h2> <p>Crop yields measured across all 47 farm plots showed substantial variation both within and between crop types (Table&nbsp;<span refid="Tab2" class="InternalRef">7</span>; Table&nbsp;<span refid="Tab3" class="InternalRef">8</span>). Yields (mean&thinsp;&plusmn;&thinsp;SD) were: maize 823.0&thinsp;&plusmn;&thinsp;112.4 kg ha⁻&sup1; (range: 650&ndash;1,010), sorghum 663.0&thinsp;&plusmn;&thinsp;131.5 kg ha⁻&sup1; (500&ndash;880), sesame 471.3&thinsp;&plusmn;&thinsp;69.9 kg ha⁻&sup1; (341.5&ndash;550), tomato 1,500.8&thinsp;&plusmn;&thinsp;56.3 kg ha⁻&sup1; (1,400&ndash;1,578), and banana 17,574.1&thinsp;&plusmn;&thinsp;140.6 kg ha⁻&sup1; (17,340&ndash;17,815).</p> <p>All yields fell well below FAO global benchmarks (Table&nbsp;<span refid="Tab3" class="InternalRef">8</span>). Maize (823 kg ha⁻&sup1;) reached only 9&ndash;14% of the FAO irrigated range (6,000&ndash;9,000 kg ha⁻&sup1;) and less than one-fifth of the Ethiopian national average (4,240 kg ha⁻&sup1;). Sorghum (663 kg ha⁻&sup1;) represented 13&ndash;19% of the FAO range (3,500&ndash;5,000 kg ha⁻&sup1;). Tomato yield (1,501 kg ha⁻&sup1; fresh weight) was only 2&ndash;3% of FAO potential (45,000&ndash;65,000 kg ha⁻&sup1;). This exceptionally low value likely reflects subsistence-scale production, post-harvest losses attributed to farmers during interviews, and possible underreporting; it should be interpreted with caution. Banana (17,574 kg ha⁻&sup1;), the highest-yielding crop, reached 29&ndash;44% of FAO benchmarks and remained below pre-civil-war Somali records of 21,200 kg ha⁻&sup1; (FAOSTAT, 2025).</p> <p>Differences in mean yield across crop types were statistically significant (p&thinsp;&lt;&thinsp;0.001). Post-hoc Tukey HSD tests confirmed that banana was statistically distinct from all other crops, while maize, sorghum, sesame, and tomato formed separate subgroups. The coefficient of variation for sorghum (19.8%) and maize (13.7%) was higher than for banana (0.8%) and tomato (3.7%), indicating greater production variability for cereal crops consistent with their higher sensitivity to irrigation scheduling and soil heterogeneity.</p> <p>Low yields in the study area reflect a confluence of factors: (i) farmers apply irrigation water on a fixed calendar rather than crop-demand basis, resulting in either deficits or surpluses at different growth stages; (ii) access to improved seeds is extremely limited, with farmers relying predominantly on locally saved seed of low genetic potential; (iii) fertilizer use is negligible, with mean application rates well below recommended levels; (iv) pest and disease management is largely absent; and (v) climate-induced flooding during the Gu season periodically destroys standing crops (Sandstr&ouml;m, 2021).</p> </div> <div id="Sec19" class="Section2"> <h2>4.2 Crop Evapotranspiration and Irrigation Water Requirements</h2> <p>CROPWAT-estimated seasonal ETc values reflected expected patterns across crop types and growing seasons (Tables&nbsp;<span refid="Tab4" class="InternalRef">2</span>&ndash;<span refid="Tab8" class="InternalRef">6</span>; Table&nbsp;<span refid="Tab2" class="InternalRef">7</span>). Banana exhibited the highest seasonal ETc (893.5&thinsp;&plusmn;&thinsp;3.9 mm) due to its perennial growth cycle and high transpiration demand. Sorghum had the second-highest ETc (466.1&thinsp;&plusmn;&thinsp;58.0 mm), followed by tomato (433.3&thinsp;&plusmn;&thinsp;12.1 mm), sesame (330.5&thinsp;&plusmn;&thinsp;10.3 mm), and maize (329.8&thinsp;&plusmn;&thinsp;2.6 mm). Net irrigation water requirements calculated by CROPWAT were 180.5 mm (maize), 270.8 mm (sorghum), 225.4 mm (sesame), 391.0 mm (tomato), and 624.5 mm (banana).</p> <p>A comparison of CROPWAT-derived irrigation requirements with farmer-applied volumes revealed significant mismatches (Table&nbsp;<span refid="Tab2" class="InternalRef">7</span>). Farmers applied considerably more water than the CROPWAT estimate for maize (408.9 vs. 180.5 mm, a 127% excess), sesame (415.1 vs. 225.4 mm, 84% excess), tomato (616.8 vs. 391.0 mm, 58% excess), and banana (1,314.0 vs. 624.5 mm, 110% excess). In contrast, sorghum received substantially less water than its CROPWAT estimate (187.1 vs. 270.8 mm, a 31% deficit). This pattern suggests that farmers over-irrigate high-value horticultural crops (tomato, banana) and annual cereals (maize, sesame) while under-irrigating sorghum, possibly because sorghum is grown on plots with shorter pump access or lower farmer investment.</p> <p>Within crop groups, higher applied water volumes were consistently associated with lower IWUE, reflecting systematic efficiency losses from over-irrigation. Across crop groups, however, banana's high applied water and high IWUE confound a simple pooled correlation. The within-crop pattern confirms that water applied well beyond CROPWAT-estimated requirements does not contribute to yield but increases non-productive evaporation and drainage losses.</p> </div> <div id="Sec20" class="Section2"> <h2>4.3 Water Use Efficiency and Irrigation Water Use Efficiency</h2> <p>WUE and IWUE values for all crops are summarized in Table&nbsp;<span refid="Tab2" class="InternalRef">7</span>. Mean WUE ranged from 0.14 kg m⁻&sup3; (sesame) to 1.97 kg m⁻&sup3; (banana). Mean IWUE ranged from 0.12 kg m⁻&sup3; (sesame) to 1.40 kg m⁻&sup3; (banana). Differences in WUE and IWUE among crops were statistically significant (p&thinsp;&lt;&thinsp;0.001).</p> <p> <div class="gridtable"><table float="Yes" id="Tab2" border="1"> <caption language="En"> <div class="CaptionNumber">Table 7</div> <div class="CaptionContent"> <p>Summary of water productivity indicators for all crops (Mean&thinsp;&plusmn;&thinsp;SD)</p> </div> </caption> <colgroup cols="9"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <div align="char" char="." class="colspec" colname="c4" colnum="4"></div> <div align="char" char="." class="colspec" colname="c5" colnum="5"></div> <div align="char" char="." class="colspec" colname="c6" colnum="6"></div> <div align="char" char="." class="colspec" colname="c7" colnum="7"></div> <div align="char" char="." class="colspec" colname="c8" colnum="8"></div> <div align="char" char="." class="colspec" colname="c9" colnum="9"></div> <thead> <tr> <th align="left" colname="c1"> <p>Crop</p> </th> <th align="left" colname="c2"> <p>Mean Yield (kg/ha)</p> </th> <th align="left" colname="c3"> <p>&plusmn;SD</p> </th> <th align="left" colname="c4"> <p>ETc (mm)</p> </th> <th align="left" colname="c5"> <p>&plusmn;SD</p> </th> <th align="left" colname="c6"> <p>CWR (mm)</p> </th> <th align="left" colname="c7"> <p>Water Applied (mm)</p> </th> <th align="left" colname="c8"> <p>WUE (kg/m&sup3;)</p> </th> <th align="left" colname="c9"> <p>IWUE (kg/m&sup3;)</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Maize</p> </td> <td align="char" char="." colname="c2"> <p>823.0</p> </td> <td align="char" char="." colname="c3"> <p>&plusmn;&thinsp;112.4</p> </td> <td align="char" char="." colname="c4"> <p>329.8</p> </td> <td align="char" char="." colname="c5"> <p>&plusmn;&thinsp;2.6</p> </td> <td align="char" char="." colname="c6"> <p>180.5</p> </td> <td align="char" char="." colname="c7"> <p>408.9</p> </td> <td align="char" char="." colname="c8"> <p>0.25</p> </td> <td align="char" char="." colname="c9"> <p>0.23</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Sorghum</p> </td> <td align="char" char="." colname="c2"> <p>663.0</p> </td> <td align="char" char="." colname="c3"> <p>&plusmn;&thinsp;131.5</p> </td> <td align="char" char="." colname="c4"> <p>466.1</p> </td> <td align="char" char="." colname="c5"> <p>&plusmn;&thinsp;58.0</p> </td> <td align="char" char="." colname="c6"> <p>270.8</p> </td> <td align="char" char="." colname="c7"> <p>187.1</p> </td> <td align="char" char="." colname="c8"> <p>0.21</p> </td> <td align="char" char="." colname="c9"> <p>0.90</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Sesame</p> </td> <td align="char" char="." colname="c2"> <p>471.3</p> </td> <td align="char" char="." colname="c3"> <p>&plusmn;&thinsp;69.9</p> </td> <td align="char" char="." colname="c4"> <p>330.5</p> </td> <td align="char" char="." colname="c5"> <p>&plusmn;&thinsp;10.3</p> </td> <td align="char" char="." colname="c6"> <p>225.4</p> </td> <td align="char" char="." colname="c7"> <p>415.1</p> </td> <td align="char" char="." colname="c8"> <p>0.14</p> </td> <td align="char" char="." colname="c9"> <p>0.12</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Tomato</p> </td> <td align="char" char="." colname="c2"> <p>1,500.8</p> </td> <td align="char" char="." colname="c3"> <p>&plusmn;&thinsp;56.3</p> </td> <td align="char" char="." colname="c4"> <p>433.3</p> </td> <td align="char" char="." colname="c5"> <p>&plusmn;&thinsp;12.1</p> </td> <td align="char" char="." colname="c6"> <p>391.0</p> </td> <td align="char" char="." colname="c7"> <p>616.8</p> </td> <td align="char" char="." colname="c8"> <p>0.31</p> </td> <td align="char" char="." colname="c9"> <p>0.25</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Banana</p> </td> <td align="char" char="." colname="c2"> <p>17,574.1</p> </td> <td align="char" char="." colname="c3"> <p>&plusmn;&thinsp;140.6</p> </td> <td align="char" char="." colname="c4"> <p>893.5</p> </td> <td align="char" char="." colname="c5"> <p>&plusmn;&thinsp;3.9</p> </td> <td align="char" char="." colname="c6"> <p>624.5</p> </td> <td align="char" char="." colname="c7"> <p>1,314.0</p> </td> <td align="char" char="." colname="c8"> <p>1.97</p> </td> <td align="char" char="." colname="c9"> <p>1.40</p> </td> </tr> </tbody> </colgroup> <tfoot> <tr><td colspan="9"><em>Note: SD&thinsp;=&thinsp;Standard Deviation; ETc&thinsp;=&thinsp;Crop evapotranspiration; CWR&thinsp;=&thinsp;Crop water requirement; WUE&thinsp;=&thinsp;Water use efficiency; IWUE&thinsp;=&thinsp;Irrigation water use efficiency.</em></td></tr> </tfoot> </table></div> </p> <p>Maize WUE (0.25 kg m⁻&sup3;) is substantially below the FAO range of 0.8&ndash;1.6 kg m⁻&sup3; and the global median of 1.80 kg m⁻&sup3; reported by Zwart and Bastiaanssen (2004). Since ETc (329.8 mm) falls within the normal seasonal range, the primary constraint lies on the production side poor crop variety, minimal inputs, and absent agronomic management rather than water availability per se.</p> <p>Sorghum WUE (0.21 kg m⁻&sup3;) falls below the FAO range (0.6&ndash;1.0 kg m⁻&sup3;). The IWUE of 0.90 kg m⁻&sup3; is relatively higher than for maize on a per-applied-water basis, which is consistent with sorghum receiving less irrigation water than estimated by CROPWAT a situation that may have induced mild water stress but also means less water was wasted. The high ETc standard deviation for sorghum (58.0 mm) reflects diverse planting dates across the 10 plots.</p> <p>Sesame showed the lowest WUE and IWUE of all studied crops (0.14 and 0.12 kg m⁻&sup3;, respectively). While these values are below the FAO reference range (0.28&ndash;0.32 kg m⁻&sup3;), the magnitude of the deficit is smaller in relative terms than for maize or tomato, since sesame is inherently a low-yielding crop. Farmers applied on average 415 mm to sesame crops more than 80% above the CROPWAT-estimated net requirement suggesting that heavy over-irrigation is a key constraint for this crop.</p> <p>Tomato IWUE (0.25 kg m⁻&sup3;) is far below the FAO benchmark of 10&ndash;12 kg m⁻&sup3; and the Ethiopian drip-irrigated value of 4.2&ndash;5.8 kg m⁻&sup3; (Wondatir &amp; Belay, 2020). The recorded yield of 1,501 kg ha⁻&sup1; is unusually low even for subsistence conditions; measurement uncertainty from farmer interviews and potential post-harvest loss attribution cannot be excluded. Notwithstanding, gross over-irrigation (617 mm applied vs. 391 mm required) and absent agronomic inputs remain clear constraints on tomato water productivity in the study area.</p> <p>Banana WUE (1.97 kg m⁻&sup3;) is within the lower range of FAO benchmarks (2.5&ndash;4.0 kg m⁻&sup3;) and substantially higher than all other crops in the study. This is attributable to banana's higher intrinsic yield potential, the greater farmer investment in banana cultivation (as a high-value perennial export crop), and the relatively stable growing conditions along the Shabelle riverbank. Banana IWUE (1.40 kg m⁻&sup3;) is below the WUE value because farmers apply approximately 110% more water than the estimated requirement indicating that even the best-performing crop in the study area suffers from inefficient water management.</p> <p> <div class="gridtable"><table float="Yes" id="Tab3" border="1"> <caption language="En"> <div class="CaptionNumber">Table 8</div> <div class="CaptionContent"> <p>Comparative water productivity with international benchmarks</p> </div> </caption> <colgroup cols="5"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <div align="left" class="colspec" colname="c5" colnum="5"></div> <thead> <tr> <th align="left" colname="c1"> <p>Country/Region</p> </th> <th align="left" colname="c2"> <p>Crop</p> </th> <th align="left" colname="c3"> <p>Yield (kg/ha)</p> </th> <th align="left" colname="c4"> <p>WUE (kg/m&sup3;)</p> </th> <th align="left" colname="c5"> <p>Reference</p> </th> </tr> <tr> <th align="left" colname="c1"> <p>Somalia (this study)</p> </th> <th align="left" colname="c2"> <p>Maize</p> </th> <th align="left" colname="c3"> <p>823</p> </th> <th align="left" colname="c4"> <p>0.25</p> </th> <th align="left" colname="c5"> <p>Present study</p> </th> </tr> <tr> <th align="left" colname="c1"> <p>Somalia (this study)</p> </th> <th align="left" colname="c2"> <p>Sorghum</p> </th> <th align="left" colname="c3"> <p>663</p> </th> <th align="left" colname="c4"> <p>0.21</p> </th> <th align="left" colname="c5"> <p>Present study</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p><b>Somalia (this study)</b></p> </td> <td align="left" colname="c2"> <p><b>Sesame</b></p> </td> <td align="left" colname="c3"> <p><b>471</b></p> </td> <td align="left" colname="c4"> <p><b>0.14</b></p> </td> <td align="left" colname="c5"> <p><b>Present study</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Somalia (this study)</b></p> </td> <td align="left" colname="c2"> <p><b>Tomato</b></p> </td> <td align="left" colname="c3"> <p><b>1,501</b></p> </td> <td align="left" colname="c4"> <p><b>0.31</b></p> </td> <td align="left" colname="c5"> <p><b>Present study</b></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Somalia (this study)</b></p> </td> <td align="left" colname="c2"> <p><b>Banana</b></p> </td> <td align="left" colname="c3"> <p><b>17,574</b></p> </td> <td align="left" colname="c4"> <p><b>1 > </td> <td align="left" colname="c5"> <p>FAO, 2020</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>FAO global range</p> </td> <td align="left" colname="c2"> <p>Sorghum</p> </td> <td align="left" colname="c3"> <p>3,500&ndash;5,000</p> </td> <td align="left" colname="c4"> <p>0.6&ndash;1.0</p> </td> <td align="left" colname="c5"> <p>FAO, 2020</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>FAO global range</p> </td> <td align="left" colname="c2"> <p>Tomato</p> </td> <td align="left" colname="c3"> <p>45,000&ndash;65,000</p> </td> <td align="left" colname="c4"> <p>10&ndash;12</p> </td> <td align="left" colname="c5"> <p>FAO, 2020</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>FAO global range</p> </td> <td align="left" colname="c2"> <p>Banana</p> </td> <td align="left" colname="c3"> <p>40,000&ndash;60,000</p> </td> <td align="left" colname="c4"> <p>2.5&ndash;4.0</p> </td> <td align="left" colname="c5"> <p>FAO, 2020</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Ethiopia (drip)</p> </td> <td align="left" colname="c2"> <p>Tomato</p> </td> <td align="left" colname="c3"> <p>10,200&ndash;18,260</p> </td> <td align="left" colname="c4"> <p>4.2&ndash;5.8</p> </td> <td align="left" colname="c5"> <p>Wondatir &amp; Belay, 2020</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>USA</p> </td> <td align="left" colname="c2"> <p>Sorghum</p> </td> <td align="left" colname="c3"> <p>3,340&ndash;3,770</p> </td> <td align="left" colname="c4"> <p>1.47&ndash;1.52</p> </td> <td align="left" colname="c5"> <p>Tolk &amp; Howell, 2021</p> </td> </tr> </tbody> </colgroup> <tfoot> <tr><td colspan="5"><em>Note: Somalia values (highlighted) are from the present study. Dashes indicate data not reported.</em></td></tr> </tfoot> </table></div> </p> </div> <div id="Sec21" class="Section2"> <h2>4.4 Factors Limiting Agricultural Water Productivity in Somalia</h2> <p>The productivity deficit across all five crops reflects interacting agronomic, infrastructural, and institutional constraints:</p> <p> <b>(a) Irrigation method and scheduling</b>: All 47 farms in the study use uncontrolled surface irrigation via earthen canals or direct pump discharge onto fields. There is no irrigation scheduling or demand management. Flood and basin irrigation methods generate high deep-percolation and runoff losses, reducing application efficiency to 40&ndash;50% under current conditions.</p>  <p> <b>(b) Conveyance infrastructure</b>: Unlined earthen canals convey water from pump outlets to fields with efficiencies of 0.50&ndash;0.65, compared with 0.85&ndash;0.95 for lined systems (Howell, 2003), resulting in large seepage and evaporation losses before water reaches the root zone.</p> <p> <b>(c) Input access and management</b>: Access to certified seed, fertilizers, and crop protection products is extremely limited in the Afgoi district. Soil fertility is declining in areas affected by over-irrigation and salinization, further suppressing yields.</p>  <p> <b>(d) Climate variability</b>: Irregular Gu and Deyr rainfall, frequent dry spells, and periodic flooding create unpredictable growing conditions, causing either moisture stress or crop inundation depending on the season.</p> </div> <div id="Sec22" class="Section2"> <h2>4.5 Climate Change Implications for Water Productivity</h2> <p>The water productivity values documented in this study already reflect a climate that is more variable and drought-prone than the historical baseline. Looking forward, climate change is projected to intensify all of the above pressures. Rising temperatures will increase ETo throughout the year, widening the gap between rainfall supply and crop demand and increasing the irrigation water required to sustain current production levels. Projected drying trends in the Gu season under RCP8.5 scenarios could reduce effective seasonal rainfall in the Lower Shabelle by 10&ndash;20% by mid-century, directly reducing effective rainfall available to crops and increasing net irrigation requirements (IPCC, 2022). Higher wind speeds and lower humidity during the Jilaal and Hagaa seasons will further increase ETc for all five crops studied.</p> <p>These projected changes render the current low-efficiency irrigation system progressively less viable. As water availability decreases and demand increases, the economic and food security costs of the existing 40&ndash;50% irrigation efficiency will escalate. Climate-smart irrigation approaches &mdash; including drip and sprinkler technologies, regulated deficit irrigation for drought-tolerant crops, and real-time irrigation scheduling based on crop water balance monitoring can simultaneously reduce water consumption and maintain or improve yields. Studies in Ethiopia using drip irrigation have demonstrated WUE improvements of 30&ndash;50% relative to surface irrigation (Wondatir &amp; Belay, 2020), providing a regionally relevant proof of concept for adoption in Somalia.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">5. POLICY IMPLICATIONS</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>The findings of this study have direct implications for government, development partners, and water management institutions in Somalia:</p> <p>For the Federal Government of Somalia and the Ministry of Agriculture and Irrigation, the results provide a quantified evidence base for prioritizing irrigation rehabilitation within the National Development Plan (NDP) and Somalia's Nationally Determined Contributions (NDCs) to the UNFCCC. The study recommends establishing a national irrigation monitoring system that tracks WUE at the district level, linking water allocation to productivity performance, and funding the rehabilitation of lined canal networks along the Shabelle to reduce conveyance losses.</p> <p>For international donors and NGOs operating in the agricultural sector (WFP, FAO, USAID, EU), the data justify investment in farmer training programs on irrigation scheduling and the subsidized distribution or leasing of flow meters simple and low-cost tools that demonstrated utility in this study. Demonstration plots using drip or sprinkler systems, co-financed with local counterpart institutions, could generate locally credible evidence to accelerate technology adoption.</p> <p>For water management institutions and river basin authorities, re-establishment of at least one functioning Shabelle River barrage combined with improved water distribution infrastructure would allow transition from uncontrolled pump irrigation to regulated supply-based allocation, the single most impactful structural intervention available. Integration of climate-adaptive management rules (drought contingency allocations, flood early warning) into barrage operations is essential for long-term resilience.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">6. CONCLUSIONS AND RECOMMENDATIONS</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>This study presents a field-measured, multi-crop assessment of agricultural water productivity in the Afgoi irrigation district of the Lower Shabelle region, Somalia. Using flow-meter measurements on 47 farm plots combined with FAO CROPWAT 8.0 modeling and long-term climate data, WUE and IWUE were quantified for maize, sorghum, sesame, tomato, and banana.</p> <p>Key conclusions are as follows. First, crop yields in the study area are five to fifteen times lower than FAO global benchmarks and two to five times below regional comparators in Ethiopia and Kenya, representing a profound agricultural productivity deficit rooted in poor irrigation management, inadequate inputs, and climate variability. Second, farmers systematically over-irrigate maize, sesame, tomato, and banana (by 58&ndash;127% above CROPWAT-estimated requirements) while under-irrigating sorghum. This mismatch between applied water and crop demand is a primary driver of low WUE and IWUE. Third, all WUE and IWUE values are substantially below international benchmarks: banana performs best (WUE 1.97 kg m⁻&sup3;; IWUE 1.40 kg m⁻&sup3;) while sesame performs worst (WUE 0.14 kg m⁻&sup3;; IWUE 0.12 kg m⁻&sup3;). Fourth, rising temperatures and intensified rainfall variability are likely to further erode water productivity under the current irrigation paradigm, reinforcing the urgency of structural intervention.</p> <p>Based on these findings, the following recommendations are made: (i) transition from uncontrolled surface irrigation to demand-driven irrigation scheduling, initially using simple crop water balance tools calibrated to local CROPWAT outputs; (ii) rehabilitate main irrigation canals with concrete lining or closed pipe distribution systems to reduce conveyance losses; (iii) introduce pressurized drip or sprinkler irrigation for high-value crops (tomato, banana) with government and NGO co-financing; (iv) strengthen access to certified seed, fertilizers, and crop protection products through targeted agricultural input programs; (v) establish district-level water productivity monitoring systems to track progress and guide adaptive management; and (vi) integrate climate-resilient crop varieties and regulated deficit irrigation strategies into national extension services.</p> <div id="Sec25" class="Section2"> <h2>6.1 Limitations and Future Research</h2> <p>This study is limited to one season, one district, and 47 plots. Future research should: (a) extend the study to multiple seasons to capture inter-annual variability associated with ENSO cycles; (b) include soil moisture monitoring and salinity measurement to assess soil-related yield constraints; (c) conduct economic water productivity analysis (revenue per m&sup3;) to guide crop-mix optimization; (d) integrate GIS and remote sensing to map irrigation efficiency at the basin scale; and (e) evaluate the cost-effectiveness of alternative irrigation technologies (drip, sprinkler) under Somali field conditions.</p> </div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><h2>Author Contribution</h2><p>Author contributions are defined in accordance with the CRediT (Contributor Roles Taxonomy) framework.Mohamed Hassan Osman: Conceptualization; Methodology; Data curation; Formal analysis; Investigation; Writing &ndash; Original Draft; Writing &ndash; Review &amp; Editing.Ahmed Mohamud Mohamed: Conceptualization; Supervision; Resources; Validation; Writing &ndash; Review &amp; Editing.All authors have read and agreed to the published version of the manuscript</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Refere gI+uV4j/HNH98O2/NLJz/+nPOtTo6f/fAxvFoYmBFMNgkwiVc5uu4PpKgeBaNgFIyCkQMAcbBE98fQukoAAAAASUVORK5CYII=","orcid":"","institution":"University of Somalia","correspondingAuthor":true,"submittingAuthor":false,"prefix":"","firstName":"Mohamed","middleName":"","lastName":"Hassan","suffix":""},{"id":645401071,"identity":"8f357cc7-d850-4db9-9cde-b1bccfae7766","order_by":1,"name":"Ahmed Mohamud","email":"","orcid":"","institution":"University of Somalia","correspondingAuthor":false,"submittingAuthor":false,"prefix":"","firstName":"Ahmed","middleName":"","lastName":"Mohamud","suffix":""}],"badges":[],"createdAt":"2026-05-25 09:08:41","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-9812786/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-9812786/v1","draftVersion":[],"editorialEvents":[],"editorialNote":"","failedWorkflow":false,"files":[{"id":110407108,"identity":"aedd0494-988d-46f7-bb09-8ed866c20083","added_by":"auto","created_at":"2026-06-01 05:49:26","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":520770,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-9812786/v1/e84b0fdf-b0dd-46b7-a03b-227a5a2fabc5.pdf"}],"financialInterests":"No competing interests reported.","formattedTitle":"\u003cp\u003eWater Use Efficiency of Irrigated Crops in Afgoi, Somalia: A Field and CROPWAT Analysis\u003c/p\u003e","fulltext":[{"header":"1. INTRODUCTION","content":"\u003cp\u003eEfficient irrigation management is central to food security in water-scarce regions. Agriculture accounts for approximately 70% of global freshwater withdrawals, and improving agricultural water productivity is increasingly urgent as climate variability intensifies (Teweldebrihan \u0026amp; Olum, 2025).\u003c/p\u003e \u003cp\u003eIn East Africa, these pressures are compounded by persistent climate variability and fragile institutional frameworks; the region irrigates less than 2% of its cultivated area sustainably, against a global average of approximately 20% (Teweldebrihan \u0026amp; Olum, 2025). Somalia represents an especially acute case.\u003c/p\u003e \u003cp\u003eSomalia is classified as predominantly arid to semi-arid, with mean annual rainfall of approximately 582 mm concentrated in two rainy seasons (Gu: April\u0026ndash;June; Deyr: September\u0026ndash;November) that are notoriously erratic and subject to El Ni\u0026ntilde;o\u0026ndash;Southern Oscillation (ENSO)-related variability (Venema \u0026amp; Vargas, 2007). Historically, the alluvial plains of the Jubba and Shabelle Rivers supported over 220,000 ha of irrigated and recession agriculture, producing export-quality bananas, rice, sesame, and sugarcane (Sandstr\u0026ouml;m, 2021). The collapse of central government in 1990 caused catastrophic degradation of irrigation infrastructure: all major barrages on the Shabelle and Jubba rivers ceased to function, irrigation canals fell into disrepair, and irrigated area contracted sharply. Three decades of conflict, compounded by recurring droughts and floods associated with climate change, have further eroded agricultural capacity (FAOSWALIM, 2020).\u003c/p\u003e \u003cp\u003eDespite growing recognition of Somalia's irrigation rehabilitation potential particularly along the Lower Shabelle, described as the 'breadbasket of Somalia' rigorous field-level data on actual water use, crop yields, and water productivity remain almost entirely absent from the scientific literature. The few existing assessments are desk-based or rely on remote sensing (Oduori et al., 2012; Sandstr\u0026ouml;m, 2021), with virtually no peer-reviewed studies measuring on-farm WUE and IWUE through direct flow monitoring and CROPWAT analysis in the Somali context.\u003c/p\u003e \u003cdiv id=\"Sec2\" class=\"Section2\"\u003e \u003ch2\u003e1.1 Research Gap and Study Novelty\u003c/h2\u003e \u003cp\u003eThe absence of field-calibrated water productivity benchmarks for Somali irrigated agriculture constitutes a critical evidence gap that impedes rational investment in irrigation rehabilitation, climate-adaptation planning, and agricultural extension. Previous regional studies either focus on Jubba or Shabelle basin hydrology at a macro-scale (Basnyat, 2007; FAOSWALIM, 2020) or rely on modelled estimates rather than measured on-farm data. No published study to date has simultaneously measured farmer-applied irrigation water using flow meters, estimated CROPWAT-based crop water requirements under Somali climatic conditions, and computed WUE and IWUE for multiple crops across a field-based sample of farm plots in the Lower Shabelle region.\u003c/p\u003e \u003cp\u003eThis study addresses that gap by providing a multi-crop, field-measured assessment of agricultural water productivity in the Afgoi irrigation district a key production zone approximately 30 km southwest of Mogadishu. The findings are contextualized against pre-war Somali records, neighboring East African countries (Ethiopia, Kenya), and global FAO benchmarks to quantify the magnitude of the productivity deficit and identify priority intervention pathways.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec3\" class=\"Section2\"\u003e \u003ch2\u003e1.2 Research Objectives\u003c/h2\u003e \u003cp\u003eThe specific objectives of this study were:\u003c/p\u003e \u003cp\u003e \u003col\u003e \u003cspan\u003e  \u003cli\u003e \u003cp\u003eTo measure seasonal crop yields for five major irrigated crops (maize, sorghum, sesame, tomato, and banana) in the Afgoi district through a structured farm-level survey.\u003c/p\u003e \u003c/li\u003e \u003c/span\u003e \u003cspan\u003e  \u003cli\u003e \u003cp\u003eTo quantify actual irrigation water applied by farmers using in-situ flow meters and to estimate crop water requirements and irrigation scheduling using the FAO CROPWAT 8.0 model.\u003c/p\u003e \u003c/li\u003e \u003c/span\u003e \u003cspan\u003e  \u003cli\u003e \u003cp\u003eTo calculate WUE and IWUE for each crop and compare results with international benchmarks and neighboring countries.\u003c/p\u003e \u003c/li\u003e \u003c/span\u003e \u003cspan\u003e  \u003cli\u003e \u003cp\u003eTo identify key constraints to agricultural water productivity and formulate evidence-based recommendations for irrigation improvement and climate-adaptive water management in Somalia.\u003c/p\u003e \u003c/li\u003e \u003c/span\u003e \u003c/ol\u003e \u003c/p\u003e \u003c/div\u003e"},{"header":"2. LITERATURE REVIEW","content":"\u003cdiv id=\"Sec5\" class=\"Section2\"\u003e \u003ch2\u003e2.1 Concepts of Agricultural Water Productivity\u003c/h2\u003e \u003cp\u003eWater productivity (WP) in agriculture refers to the ratio of economic output to the water input used in its production. Two metrics are conventionally used: water use efficiency (WUE), which relates crop yield (kg ha⁻\u0026sup1;) to seasonal crop evapotranspiration or ETc (mm), and irrigation water use efficiency (IWUE), which relates yield to the volume of irrigation water actually applied by the farmer (Jomaa \u0026amp; Shaban, 2018; Howell, 2003). WUE and IWUE are expressed in kg m⁻\u0026sup3;. Enhancing both metrics is essential in water-scarce environments, since it allows the same food output to be produced with less water, reducing competition between agricultural and domestic or industrial users (Howell, 2003)\u003c/p\u003e \u003cp\u003eIrrigation efficiency, a related concept, captures the ratio of water reaching the crop root zone to water diverted from the source (Howell, 2003). Surface irrigation methods flood, furrow, and basin typically achieve application efficiencies of 50\u0026ndash;60% under field conditions in developing countries, compared with 75\u0026ndash;85% for sprinkler systems and 88\u0026ndash;95% for well-designed drip systems (Brouwer \u0026amp; Heibloem, 1986). FAO estimated Somalia's overall irrigation efficiency at approximately 40% in 2010, indicating major losses in conveyance, distribution, and field application (FAO, 2010).\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec6\" class=\"Section2\"\u003e \u003ch2\u003e2.2 Water Productivity of Major Irrigated Crops\u003c/h2\u003e \u003cp\u003eGlobal databases and field experiments provide robust WUE benchmarks for the crops studied here. For maize, FAO (2020) reports WUE values of 0.8\u0026ndash;1.6 kg m⁻\u0026sup3; under conventional irrigation globally. Allen et al. (2021) documented WUE of 1.76\u0026ndash;2.71 kg m⁻\u0026sup3; in the United States under optimized management. Zwart and Bastiaanssen (2004), in a global review of 84 studies, reported a median maize WUE of 1.80 kg m⁻\u0026sup3; (range: 0.3\u0026ndash;2.7 kg m⁻\u0026sup3;). These benchmarks illustrate the large gap between internationally achievable performance and the Somali values reported in the present study.\u003c/p\u003e \u003cp\u003eFor sorghum, FAO (2020) reports a seasonal water requirement of 450\u0026ndash;650 mm, yields of 3.5\u0026ndash;5.0 t ha⁻\u0026sup1;, and WUE of 0.6\u0026ndash;1.0 kg m⁻\u0026sup3;. Tolk and Howell (2021) measured sorghum WUE of 1.47\u0026ndash;1.52 kg m⁻\u0026sup3; in the USA.\u003c/p\u003e \u003cp\u003eSesame is drought-tolerant, with a seasonal water requirement of 430\u0026ndash;470 mm and WUE of 0.28\u0026ndash;0.32 kg m⁻\u0026sup3; (FAO, 2020). Tomato has potential yields of 45\u0026ndash;65 t ha⁻\u0026sup1; and WUE up to 10\u0026ndash;12 kg m⁻\u0026sup3; under well-managed irrigation; drip-irrigated tomato in Ethiopia achieved 4.2\u0026ndash;5.8 kg m⁻\u0026sup3; (Wondatir \u0026amp; Belay, 2020). Banana requires 1,200\u0026ndash;2,200 mm seasonally and yields 40\u0026ndash;60 t ha⁻\u0026sup1; with WUE of 2.5\u0026ndash;4.0 kg m⁻\u0026sup3; (FAO, 2020).\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec7\" class=\"Section2\"\u003e \u003ch2\u003e2.3 Irrigation Water Management in Somalia and East Africa\u003c/h2\u003e \u003cp\u003eHistorical records indicate that the Jubba and Shabelle basins sustained irrigated production across more than 220,000 ha before 1990 (Sandstr\u0026ouml;m, 2021). Irrigation water requirements in the Shabelle basin were estimated at approximately 11,400 m\u0026sup3; ha⁻\u0026sup1; per season (0.36 l s⁻\u0026sup1; ha⁻\u0026sup1;), assuming 65% field application efficiency (Basnyat, 2007). Post-conflict assessments document the near-total collapse of infrastructure: all eight Shabelle barrages are non-functional, main canals are heavily silted, and farmers rely predominantly on diesel-powered pump systems drawing directly from the river (FAOSWALIM, 2020).\u003c/p\u003e \u003cp\u003eSomalia's irrigation sector is further constrained by three decades of institutional collapse, ongoing insecurity, and a near-total absence of functioning water control infrastructure. These conditions collectively explain the low productivity baseline documented in the present study.\u003c/p\u003e \u003c/div\u003e"},{"header":"3. MATERIALS AND METHODS","content":"\u003cdiv id=\"Sec9\" class=\"Section2\"\u003e \u003ch2\u003e3.1 Study Area\u003c/h2\u003e \u003cp\u003eThe study was conducted in the Afgoi irrigation district, Lower Shabelle (Shabeellaha Hoose) Region, southwestern Somalia, approximately 30 km southwest of Mogadishu (centroid coordinates: 2\u0026deg;8\u0026prime;17\u0026Prime;N, 45\u0026deg;7\u0026prime;16\u0026Prime;E; elevation 83 m above mean sea level) (Venema \u0026amp; Vargas, 2007). The district has a total population of approximately 79,400, of whom approximately 33,000 are engaged in farming. Total cultivated area in the district is 235,242 ha, comprising 121,590 ha of rainfed agriculture and 113,652 ha of irrigated agriculture (Oduori et al., 2012). The irrigated area is supplied by diesel-powered pumps extracting from the Shabelle River; no major functioning barrage or controlled distribution network currently exists (FAOSWALIM, 2020).\u003c/p\u003e \u003cp\u003eSoils are predominantly dark, clay-rich alluvial Vertisols with high water-holding capacity, moderate to poor drainage, and elevated salt content in some areas proximal to the river conditions that can reduce irrigation efficiency and negatively affect crop yields if drainage is not managed adequately (Hadden, 2007). The study area has a terrain slope of 0\u0026ndash;4%, consistent with flood-prone alluvial lowlands and well suited to surface irrigation technologies.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec10\" class=\"Section2\"\u003e \u003ch2\u003e3.2 Climate of the Study Area\u003c/h2\u003e \u003cp\u003eSomalia's climate is classified as arid to semi-arid (K\u0026ouml;ppen\u0026ndash;Geiger: BWh/BSh), characterized by high temperatures, low and highly variable rainfall, and two distinct rainy seasons. Long-term climate data (1990\u0026ndash;2021) from FAO's CLIMWAT database were used in CROPWAT calculations and are summarized in Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e. Mean annual rainfall in the study area is approximately 582 mm, concentrated in the Gu (April\u0026ndash;June, ~\u0026thinsp;249 mm) and Deyr (October\u0026ndash;November, ~\u0026thinsp;183 mm) seasons. Effective annual rainfall is approximately 511 mm. Mean daily maximum temperatures range from 30.5\u0026deg;C (July) to 35.0\u0026deg;C (March), with a long-term annual mean temperature of approximately 27\u0026deg;C. Relative humidity ranges from 65% (January) to 79% (June). Wind speeds are highest during the Southwest Monsoon (June\u0026ndash;August: 4.2\u0026ndash;5.1 m s⁻\u0026sup1;).\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab1\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 1\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eLong-term climate data for Afgoi district, Lower Shabelle, Somalia (FAO CLIMWAT, 1990\u0026ndash;2021)\u003c/p\u003e \u003c/div\u003e \u003c/capt
