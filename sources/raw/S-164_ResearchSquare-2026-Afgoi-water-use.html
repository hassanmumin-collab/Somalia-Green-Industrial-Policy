\u003e \u003cp\u003e66.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e2.9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c6\"\u003e \u003cp\u003e6.6\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c7\"\u003e \u003cp\u003e18.4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e39.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e36.6\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eMean\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u003cb\u003e22.1\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e32.3\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e72.0\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e3.5\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c6\"\u003e \u003cp\u003e\u003cb\u003e7.6\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c7\"\u003e \u003cp\u003e\u003cb\u003e20.5\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e\u003cb\u003e48.7\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e\u003cb\u003e42.6\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eAnnual\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c6\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c7\"\u003e \u003cp\u003e\u003cb\u003e\u0026mdash;\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e\u003cb\u003e582.0\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e\u003cb\u003e511.1\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003ctfoot\u003e \u003ctr\u003e\u003ctd colspan=\"9\"\u003e\u003cem\u003eNote: T_min\u0026thinsp;=\u0026thinsp;minimum daily temperature; T_max\u0026thinsp;=\u0026thinsp;maximum daily temperature; RH\u0026thinsp;=\u0026thinsp;relative humidity; Eff. Rain\u0026thinsp;=\u0026thinsp;effective rainfall calculated using USDA Soil Conservation Service method. Data source: FAO CLIMWAT database.\u003c/em\u003e\u003c/td\u003e\u003c/tr\u003e \u003c/tfoot\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec11\" class=\"Section2\"\u003e \u003ch2\u003e3.3 Sampling Design and Data Collection\u003c/h2\u003e \u003cp\u003eA total of 47 farm plots were selected using simple random sampling from the active irrigated plots registered in the district agricultural office database during the 2021 crop season. The sample included eight maize plots (Fields 1\u0026ndash;8), ten sorghum plots (Fields 9\u0026ndash;18), ten sesame plots (Fields 19\u0026ndash;28), ten tomato plots (Fields 29\u0026ndash;38), and nine banana plots (Fields 39\u0026ndash;47). Sample size was determined primarily by resource availability and site accessibility; the 47-plot field-based multi-crop sample provides useful productivity estimates but has limited statistical power for subgroup analyses and cannot be extrapolated to the broader district without caution.\u003c/p\u003e \u003cp\u003eData collection was conducted between August and December 2021, covering the full growing seasons of all five crops. The following variables were recorded: (1) crop yield (kg ha⁻\u0026sup1;), obtained through structured farmer interviews and cross-validated against plot-level harvested-area estimates; yield figures were triangulated by direct observation of harvested produce at three randomly selected plots per crop to check internal consistency; (2) total irrigation water applied per season (mm), measured using calibrated turbine flow meters (accuracy\u0026thinsp;\u0026plusmn;\u0026thinsp;2%) attached to pump outlet pipes, with readings recorded at each irrigation event; and (3) irrigation scheduling (date, duration, and frequency of events). All field data were recorded in standardized datasheets, double-entered into Microsoft Excel, and checked for transcription errors prior to analysis. Enumerators received standardized training on measurement protocols before the survey.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec12\" class=\"Section2\"\u003e \u003ch2\u003e3.4 Estimation of Reference and Crop Evapotranspiration\u003c/h2\u003e \u003cp\u003eReference evapotranspiration (ETo) was estimated using the FAO-56 Penman\u0026ndash;Monteith equation (Smith, 1992), which is the internationally recommended standard:\u003c/p\u003e \u003cp\u003e \u003cb\u003eETo = [0.408Δ(Rn\u0026thinsp;\u0026minus;\u0026thinsp;G) + γ(900/(T\u0026thinsp;+\u0026thinsp;273))u₂(eₛ \u0026minus; eₐ)] / [Δ\u0026thinsp;+\u0026thinsp;γ(1\u0026thinsp;+\u0026thinsp;0.34u₂)]\u003c/b\u003e \u003cdiv class=\"BlockQuote\"\u003e \u003cp\u003ewhere ETo is reference evapotranspiration (mm day⁻\u0026sup1;); Rn is net radiation at the crop surface (MJ m⁻\u0026sup2; day⁻\u0026sup1;); G is soil heat flux density (MJ m⁻\u0026sup2; day⁻\u0026sup1;); T is mean daily air temperature at 2 m height (\u0026deg;C); u₂ is wind speed at 2 m height (m s⁻\u0026sup1;); eₛ is saturation vapour pressure (kPa); eₐ is actual vapour pressure (kPa); Δ is slope of the vapour pressure curve (kPa \u0026deg;C⁻\u0026sup1;); and γ is the psychrometric constant (kPa \u0026deg;C⁻\u0026sup1;).\u003c/p\u003e \u003c/div\u003e \u003c/p\u003e \u003cp\u003eCrop evapotranspiration (ETc) was computed as ETc\u0026thinsp;=\u0026thinsp;ETo \u0026times; Kc, where Kc is the crop coefficient varying by growth stage as defined by FAO-56 (Pruitt \u0026amp; Doorenbos, 1977; Smith, 1992). All calculations were performed using FAO CROPWAT 8.0, with CLIMWAT long-term climate data for the study area as inputs. Effective rainfall was computed using the USDA Soil Conservation Service method within CROPWAT.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec13\" class=\"Section2\"\u003e \u003ch2\u003e3.5 Crop Water Requirement and Net Irrigation Requirement\u003c/h2\u003e \u003cp\u003eCrop water requirement (CWR) was defined as the net depth of water (mm) needed to meet crop ETc after accounting for effective precipitation:\u003c/p\u003e \u003cp\u003eCWR\u0026thinsp;=\u0026thinsp;ETc\u0026thinsp;\u0026minus;\u0026thinsp;Reff (Eq.\u0026nbsp;1)\u003c/p\u003e \u003cp\u003ewhere Reff is effective rainfall (mm). Irrigation water requirement (IWR) was derived from CWR assuming a field application efficiency of 65% (corresponding to the FAO benchmark for gravity-fed surface irrigation in developing countries; FAO, 2010).\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec14\" class=\"Section2\"\u003e \u003ch2\u003e3.6 Water Productivity Indices\u003c/h2\u003e \u003cp\u003eWUE and IWUE were computed following standard formulations (Jomaa \u0026amp; Shaban, 2018):\u003c/p\u003e \u003cp\u003eWUE (kg m⁻\u0026sup3;)\u0026thinsp;=\u0026thinsp;Y / ETc (Eq.\u0026nbsp;2)\u003c/p\u003e \u003cp\u003eIWUE (kg m⁻\u0026sup3;)\u0026thinsp;=\u0026thinsp;Y / I_applied (Eq.\u0026nbsp;3)\u003c/p\u003e \u003cp\u003ewhere Y is crop yield (kg ha⁻\u0026sup1;, converted to kg m⁻\u0026sup2;\u0026middot;mm⁻\u0026sup1; for dimensional consistency), ETc is seasonal crop evapotranspiration (mm), and I_applied is the total depth of irrigation water applied by the farmer (mm). All mm values were converted to m\u0026sup3; ha⁻\u0026sup1; (1 mm\u0026thinsp;=\u0026thinsp;10 m\u0026sup3; ha⁻\u0026sup1;) for computation.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec15\" class=\"Section2\"\u003e \u003ch2\u003e3.7 Statistical Analysis\u003c/h2\u003e \u003cp\u003eDescriptive statistics (mean, standard deviation, minimum, maximum, and coefficient of variation) were calculated for all variables. One-way analysis of variance (ANOVA) was performed to test for significant differences in WUE and IWUE across crop types (α\u0026thinsp;=\u0026thinsp;0.05). Where ANOVA indicated significant differences, Tukey's Honest Significant Difference (HSD) post-hoc test was applied for pairwise comparisons. Pearson correlation analysis was conducted to examine relationships between the volume of applied irrigation water and WUE/IWUE. All statistical analyses were performed using standard procedures in Microsoft Excel and verified by hand calculation.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec16\" class=\"Section2\"\u003e \u003ch2\u003e3.8 Study Limitations\u003c/h2\u003e \u003cp\u003eThe study is subject to several limitations. First, yield data were obtained through farmer interviews, which may be subject to recall bias and social desirability bias; harvest area estimates were cross-validated but not independently measured at the plot level. Second, the sample was limited to 47 plots due to security constraints and resource limitations, which restricts statistical power for some analyses. Third, CROPWAT ETc estimates are based on long-term average climate data rather than station data recorded during the 2021 study period, which may not fully capture intra-seasonal variability. Fourth, soil hydraulic properties (field capacity, permanent wilting point) were not measured in the field, so no soil moisture balance was computed. Fifth, the study covers a single agricultural season and cannot capture inter-annual variability in yields or water requirements. These limitations should be considered when extrapolating findings to other seasons or regions.\u003c/p\u003e \u003c/div\u003e"},{"header":"4. RESULTS AND DISCUSSION","content":"\u003cdiv id=\"Sec18\" class=\"Section2\"\u003e \u003ch2\u003e4.1 Crop Yields and Comparison with International Benchmarks\u003c/h2\u003e \u003cp\u003eCrop yields measured across all 47 farm plots showed substantial variation both within and between crop types (Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e7\u003c/span\u003e; Table\u0026nbsp;\u003cspan refid=\"Tab3\" class=\"InternalRef\"\u003e8\u003c/span\u003e). Yields (mean\u0026thinsp;\u0026plusmn;\u0026thinsp;SD) were: maize 823.0\u0026thinsp;\u0026plusmn;\u0026thinsp;112.4 kg ha⁻\u0026sup1; (range: 650\u0026ndash;1,010), sorghum 663.0\u0026thinsp;\u0026plusmn;\u0026thinsp;131.5 kg ha⁻\u0026sup1; (500\u0026ndash;880), sesame 471.3\u0026thinsp;\u0026plusmn;\u0026thinsp;69.9 kg ha⁻\u0026sup1; (341.5\u0026ndash;550), tomato 1,500.8\u0026thinsp;\u0026plusmn;\u0026thinsp;56.3 kg ha⁻\u0026sup1; (1,400\u0026ndash;1,578), and banana 17,574.1\u0026thinsp;\u0026plusmn;\u0026thinsp;140.6 kg ha⁻\u0026sup1; (17,340\u0026ndash;17,815).\u003c/p\u003e \u003cp\u003eAll yields fell well below FAO global benchmarks (Table\u0026nbsp;\u003cspan refid=\"Tab3\" class=\"InternalRef\"\u003e8\u003c/span\u003e). Maize (823 kg ha⁻\u0026sup1;) reached only 9\u0026ndash;14% of the FAO irrigated range (6,000\u0026ndash;9,000 kg ha⁻\u0026sup1;) and less than one-fifth of the Ethiopian national average (4,240 kg ha⁻\u0026sup1;). Sorghum (663 kg ha⁻\u0026sup1;) represented 13\u0026ndash;19% of the FAO range (3,500\u0026ndash;5,000 kg ha⁻\u0026sup1;). Tomato yield (1,501 kg ha⁻\u0026sup1; fresh weight) was only 2\u0026ndash;3% of FAO potential (45,000\u0026ndash;65,000 kg ha⁻\u0026sup1;). This exceptionally low value likely reflects subsistence-scale production, post-harvest losses attributed to farmers during interviews, and possible underreporting; it should be interpreted with caution. Banana (17,574 kg ha⁻\u0026sup1;), the highest-yielding crop, reached 29\u0026ndash;44% of FAO benchmarks and remained below pre-civil-war Somali records of 21,200 kg ha⁻\u0026sup1; (FAOSTAT, 2025).\u003c/p\u003e \u003cp\u003eDifferences in mean yield across crop types were statistically significant (p\u0026thinsp;\u0026lt;\u0026thinsp;0.001). Post-hoc Tukey HSD tests confirmed that banana was statistically distinct from all other crops, while maize, sorghum, sesame, and tomato formed separate subgroups. The coefficient of variation for sorghum (19.8%) and maize (13.7%) was higher than for banana (0.8%) and tomato (3.7%), indicating greater production variability for cereal crops consistent with their higher sensitivity to irrigation scheduling and soil heterogeneity.\u003c/p\u003e \u003cp\u003eLow yields in the study area reflect a confluence of factors: (i) farmers apply irrigation water on a fixed calendar rather than crop-demand basis, resulting in either deficits or surpluses at different growth stages; (ii) access to improved seeds is extremely limited, with farmers relying predominantly on locally saved seed of low genetic potential; (iii) fertilizer use is negligible, with mean application rates well below recommended levels; (iv) pest and disease management is largely absent; and (v) climate-induced flooding during the Gu season periodically destroys standing crops (Sandstr\u0026ouml;m, 2021).\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec19\" class=\"Section2\"\u003e \u003ch2\u003e4.2 Crop Evapotranspiration and Irrigation Water Requirements\u003c/h2\u003e \u003cp\u003eCROPWAT-estimated seasonal ETc values reflected expected patterns across crop types and growing seasons (Tables\u0026nbsp;\u003cspan refid=\"Tab4\" class=\"InternalRef\"\u003e2\u003c/span\u003e\u0026ndash;\u003cspan refid=\"Tab8\" class=\"InternalRef\"\u003e6\u003c/span\u003e; Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e7\u003c/span\u003e). Banana exhibited the highest seasonal ETc (893.5\u0026thinsp;\u0026plusmn;\u0026thinsp;3.9 mm) due to its perennial growth cycle and high transpiration demand. Sorghum had the second-highest ETc (466.1\u0026thinsp;\u0026plusmn;\u0026thinsp;58.0 mm), followed by tomato (433.3\u0026thinsp;\u0026plusmn;\u0026thinsp;12.1 mm), sesame (330.5\u0026thinsp;\u0026plusmn;\u0026thinsp;10.3 mm), and maize (329.8\u0026thinsp;\u0026plusmn;\u0026thinsp;2.6 mm). Net irrigation water requirements calculated by CROPWAT were 180.5 mm (maize), 270.8 mm (sorghum), 225.4 mm (sesame), 391.0 mm (tomato), and 624.5 mm (banana).\u003c/p\u003e \u003cp\u003eA comparison of CROPWAT-derived irrigation requirements with farmer-applied volumes revealed significant mismatches (Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e7\u003c/span\u003e). Farmers applied considerably more water than the CROPWAT estimate for maize (408.9 vs. 180.5 mm, a 127% excess), sesame (415.1 vs. 225.4 mm, 84% excess), tomato (616.8 vs. 391.0 mm, 58% excess), and banana (1,314.0 vs. 624.5 mm, 110% excess). In contrast, sorghum received substantially less water than its CROPWAT estimate (187.1 vs. 270.8 mm, a 31% deficit). This pattern suggests that farmers over-irrigate high-value horticultural crops (tomato, banana) and annual cereals (maize, sesame) while under-irrigating sorghum, possibly because sorghum is grown on plots with shorter pump access or lower farmer investment.\u003c/p\u003e \u003cp\u003eWithin crop groups, higher applied water volumes were consistently associated with lower IWUE, reflecting systematic efficiency losses from over-irrigation. Across crop groups, however, banana's high applied water and high IWUE confound a simple pooled correlation. The within-crop pattern confirms that water applied well beyond CROPWAT-estimated requirements does not contribute to yield but increases non-productive evaporation and drainage losses.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec20\" class=\"Section2\"\u003e \u003ch2\u003e4.3 Water Use Efficiency and Irrigation Water Use Efficiency\u003c/h2\u003e \u003cp\u003eWUE and IWUE values for all crops are summarized in Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e7\u003c/span\u003e. Mean WUE ranged from 0.14 kg m⁻\u0026sup3; (sesame) to 1.97 kg m⁻\u0026sup3; (banana). Mean IWUE ranged from 0.12 kg m⁻\u0026sup3; (sesame) to 1.40 kg m⁻\u0026sup3; (banana). Differences in WUE and IWUE among crops were statistically significant (p\u0026thinsp;\u0026lt;\u0026thinsp;0.001).\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab2\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 7\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eSummary of water productivity indicators for all crops (Mean\u0026thinsp;\u0026plusmn;\u0026thinsp;SD)\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"9\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c5\" colnum=\"5\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c6\" colnum=\"6\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c7\" colnum=\"7\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c8\" colnum=\"8\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c9\" colnum=\"9\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eCrop\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMean Yield (kg/ha)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;SD\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eETc (mm)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;SD\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c6\"\u003e \u003cp\u003eCWR (mm)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c7\"\u003e \u003cp\u003eWater Applied (mm)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c8\"\u003e \u003cp\u003eWUE (kg/m\u0026sup3;)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c9\"\u003e \u003cp\u003eIWUE (kg/m\u0026sup3;)\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMaize\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e823.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;112.4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e329.8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;2.6\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e180.5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e408.9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e0.25\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e0.23\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eSorghum\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e663.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;131.5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e466.1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;58.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e270.8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e187.1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e0.21\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e0.90\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eSesame\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e471.3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;69.9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e330.5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;10.3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e225.4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e415.1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e0.14\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e0.12\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eTomato\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1,500.8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;56.3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e433.3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;12.1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e391.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e616.8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e0.31\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e0.25\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eBanana\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e17,574.1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;140.6\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e893.5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u0026plusmn;\u0026thinsp;3.9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e624.5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e1,314.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e1.97\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c9\"\u003e \u003cp\u003e1.40\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003ctfoot\u003e \u003ctr\u003e\u003ctd colspan=\"9\"\u003e\u003cem\u003eNote: SD\u0026thinsp;=\u0026thinsp;Standard Deviation; ETc\u0026thinsp;=\u0026thinsp;Crop evapotranspiration; CWR\u0026thinsp;=\u0026thinsp;Crop water requirement; WUE\u0026thinsp;=\u0026thinsp;Water use efficiency; IWUE\u0026thinsp;=\u0026thinsp;Irrigation water use efficiency.\u003c/em\u003e\u003c/td\u003e\u003c/tr\u003e \u003c/tfoot\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eMaize WUE (0.25 kg m⁻\u0026sup3;) is substantially below the FAO range of 0.8\u0026ndash;1.6 kg m⁻\u0026sup3; and the global median of 1.80 kg m⁻\u0026sup3; reported by Zwart and Bastiaanssen (2004). Since ETc (329.8 mm) falls within the normal seasonal range, the primary constraint lies on the production side poor crop variety, minimal inputs, and absent agronomic management rather than water availability per se.\u003c/p\u003e \u003cp\u003eSorghum WUE (0.21 kg m⁻\u0026sup3;) falls below the FAO range (0.6\u0026ndash;1.0 kg m⁻\u0026sup3;). The IWUE of 0.90 kg m⁻\u0026sup3; is relatively higher than for maize on a per-applied-water basis, which is consistent with sorghum receiving less irrigation water than estimated by CROPWAT a situation that may have induced mild water stress but also means less water was wasted. The high ETc standard deviation for sorghum (58.0 mm) reflects diverse planting dates across the 10 plots.\u003c/p\u003e \u003cp\u003eSesame showed the lowest WUE and IWUE of all studied crops (0.14 and 0.12 kg m⁻\u0026sup3;, respectively). While these values are below the FAO reference range (0.28\u0026ndash;0.32 kg m⁻\u0026sup3;), the magnitude of the deficit is smaller in relative terms than for maize or tomato, since sesame is inherently a low-yielding crop. Farmers applied on average 415 mm to sesame crops more than 80% above the CROPWAT-estimated net requirement suggesting that heavy over-irrigation is a key constraint for this crop.\u003c/p\u003e \u003cp\u003eTomato IWUE (0.25 kg m⁻\u0026sup3;) is far below the FAO benchmark of 10\u0026ndash;12 kg m⁻\u0026sup3; and the Ethiopian drip-irrigated value of 4.2\u0026ndash;5.8 kg m⁻\u0026sup3; (Wondatir \u0026amp; Belay, 2020). The recorded yield of 1,501 kg ha⁻\u0026sup1; is unusually low even for subsistence conditions; measurement uncertainty from farmer interviews and potential post-harvest loss attribution cannot be excluded. Notwithstanding, gross over-irrigation (617 mm applied vs. 391 mm required) and absent agronomic inputs remain clear constraints on tomato water productivity in the study area.\u003c/p\u003e \u003cp\u003eBanana WUE (1.97 kg m⁻\u0026sup3;) is within the lower range of FAO benchmarks (2.5\u0026ndash;4.0 kg m⁻\u0026sup3;) and substantially higher than all other crops in the study. This is attributable to banana's higher intrinsic yield potential, the greater farmer investment in banana cultivation (as a high-value perennial export crop), and the relatively stable growing conditions along the Shabelle riverbank. Banana IWUE (1.40 kg m⁻\u0026sup3;) is below the WUE value because farmers apply approximately 110% more water than the estimated requirement indicating that even the best-performing crop in the study area suffers from inefficient water management.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab3\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTabl \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFAO global range\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSorghum\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3,500\u0026ndash;5,000\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e0.6\u0026ndash;1.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003eFAO, 2020\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFAO global range\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eTomato\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e45,000\u0026ndash;65,000\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e10\u0026ndash;12\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003eFAO, 2020\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFAO global range\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eBanana\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e40,000\u0026ndash;60,000\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e2.5\u0026ndash;4.0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003eFAO, 2020\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eEthiopia (drip)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eTomato\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e10,200\u0026ndash;18,260\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e4.2\u0026ndash;5.8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003eWondatir \u0026amp; Belay, 2020\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eUSA\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSorghum\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3,340\u0026ndash;3,770\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e1.47\u0026ndash;1.52\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003eTolk \u0026amp; Howell, 2021\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003ctfoot\u003e \u003ctr\u003e\u003ctd colspan=\"5\"\u003e\u003cem\u003eNote: Somalia values (highlighted) are from the present study. Dashes indicate data not reported.\u003c/em\u003e\u003c/td\u003e\u003c/tr\u003e \u003c/tfoot\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec21\" class=\"Section2\"\u003e \u003ch2\u003e4.4 Factors Limiting Agricultural Water Productivity in Somalia\u003c/h2\u003e \u003cp\u003eThe productivity deficit across all five crops reflects interacting agronomic, infrastructural, and institutional constraints:\u003c/p\u003e \u003cp\u003e \u003cb\u003e(a) Irrigation method and scheduling\u003c/b\u003e: All 47 farms in the study use uncontrolled surface irrigation via earthen canals or direct pump discharge onto fields. There is no irrigation scheduling or demand management. Flood and basin irrigation methods generate high deep-percolation and runoff losses, reducing application efficiency to 40\u0026ndash;50% under current conditions.\u003c/p\u003e  \u003cp\u003e \u003cb\u003e(b) Conveyance infrastructure\u003c/b\u003e: Unlined earthen canals convey water from pump outlets to fields with efficiencies of 0.50\u0026ndash;0.65, compared with 0.85\u0026ndash;0.95 for lined systems (Howell, 2003), resulting in large seepage and evaporation losses before water reaches the root zone.\u003c/p\u003e \u003cp\u003e \u003cb\u003e(c) Input access and management\u003c/b\u003e: Access to certified seed, fertilizers, and crop protection products is extremely limited in the Afgoi district. Soil fertility is declining in areas affected by over-irrigation and salinization, further suppressing yields.\u003c/p\u003e  \u003cp\u003e \u003cb\u003e(d) Climate variability\u003c/b\u003e: Irregular Gu and Deyr rainfall, frequent dry spells, and periodic flooding create unpredictable growing conditions, causing either moisture stress or crop inundation depending on the season.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec22\" class=\"Section2\"\u003e \u003ch2\u003e4.5 Climate Change Implications for Water Productivity\u003c/h2\u003e \u003cp\u003eThe water productivity values documented in this study already reflect a climate that is more variable and drought-prone than the historical baseline. Looking forward, climate change is projected to intensify all of the above pressures. Rising temperatures will increase ETo throughout the year, widening the gap between rainfall supply and crop demand and increasing the irrigation water required to sustain current production levels. Projected drying trends in the Gu season under RCP8.5 scenarios could reduce effective seasonal rainfall in the Lower Shabelle by 10\u0026ndash;20% by mid-century, directly reducing effective rainfall available to crops and increasing net irrigation requirements (IPCC, 2022). Higher wind speeds and lower humidity during the Jilaal and Hagaa seasons will further increase ETc for all five crops studied.\u003c/p\u003e \u003cp\u003eThese projected changes render the current low-efficiency irrigation system progressively less viable. As water availability decreases and demand increases, the economic and food security costs of the existing 40\u0026ndash;50% irrigation efficiency will escalate. Climate-smart irrigation approaches \u0026mdash; including drip and sprinkler technologies, regulated deficit irrigation for drought-tolerant crops, and real-time irrigation scheduling based on crop water balance monitoring can simultaneously reduce water consumption and maintain or improve yields. Studies in Ethiopia using drip irrigation have demonstrated WUE improvements of 30\u0026ndash;50% relative to surface irrigation (Wondatir \u0026amp; Belay, 2020), providing a regionally relevant proof of concept for adoption in Somalia.\u003c/p\u003e \u003c/div\u003e"},{"header":"5. POLICY IMPLICATIONS","content":"\u003cp\u003eThe findings of this study have direct implications for government, development partners, and water management institutions in Somalia:\u003c/p\u003e \u003cp\u003eFor the Federal Government of Somalia and the Ministry of Agriculture and Irrigation, the results provide a quantified evidence base for prioritizing irrigation rehabilitation within the National Development Plan (NDP) and Somalia's Nationally Determined Contributions (NDCs) to the UNFCCC. The study recommends establishing a national irrigation monitoring system that tracks WUE at the district level, linking water allocation to productivity performance, and funding the rehabilitation of lined canal networks along the Shabelle to reduce conveyance losses.\u003c/p\u003e \u003cp\u003eFor international donors and NGOs operating in the agricultural sector (WFP, FAO, USAID, EU), the data justify investment in farmer training programs on irrigation scheduling and the subsidized distribution or leasing of flow meters simple and low-cost tools that demonstrated utility in this study. Demonstration plots using drip or sprinkler systems, co-financed with local counterpart institutions, could generate locally credible evidence to accelerate technology adoption.\u003c/p\u003e \u003cp\u003eFor water management institutions and river basin authorities, re-establishment of at least one functioning Shabelle River barrage combined with improved water distribution infrastructure would allow transition from uncontrolled pump irrigation to regulated supply-based allocation, the single most impactful structural intervention available. Integration of climate-adaptive management rules (drought contingency allocations, flood early warning) into barrage operations is essential for long-term resilience.\u003c/p\u003e"},{"header":"6. CONCLUSIONS AND RECOMMENDATIONS","content":"\u003cp\u003eThis study presents a field-measured, multi-crop assessment of agricultural water productivity in the Afgoi irrigation district of the Lower Shabelle region, Somalia. Using flow-meter measurements on 47 farm plots combined with FAO CROPWAT 8.0 modeling and long-term climate data, WUE and IWUE were quantified for maize, sorghum, sesame, tomato, and banana.\u003c/p\u003e \u003cp\u003eKey conclusions are as follows. First, crop yields in the study area are five to fifteen times lower than FAO global benchmarks and two to five times below regional comparators in Ethiopia and Kenya, representing a profound agricultural productivity deficit rooted in poor irrigation management, inadequate inputs, and climate variability. Second, farmers systematically over-irrigate maize, sesame, tomato, and banana (by 58\u0026ndash;127% above CROPWAT-estimated requirements) while under-irrigating sorghum. This mismatch between applied water and crop demand is a primary driver of low WUE and IWUE. Third, all WUE and IWUE values are substantially below international benchmarks: banana performs best (WUE 1.97 kg m⁻\u0026sup3;; IWUE 1.40 kg m⁻\u0026sup3;) while sesame performs worst (WUE 0.14 kg m⁻\u0026sup3;; IWUE 0.12 kg m⁻\u0026sup3;). Fourth, rising temperatures and intensified rainfall variability are likely to further erode water productivity under the current irrigation paradigm, reinforcing the urgency of structural intervention.\u003c/p\u003e \u003cp\u003eBased on these findings, the following recommendations are made: (i) transition from uncontrolled surface irrigation to demand-driven irrigation scheduling, initially using simple crop water balance tools calibrated to local CROPWAT outputs; (ii) rehabilitate main irrigation canals with concrete lining or closed pipe distribution systems to reduce conveyance losses; (iii) introduce pressurized drip or sprinkler irrigation for high-value crops (tomato, banana) with government and NGO co-financing; (iv) strengthen access to certified seed, fertilizers, and crop protection products through targeted agricultural input programs; (v) establish district-level water productivity monitoring systems to track progress and guide adaptive management; and (vi) integrate climate-resilient crop varieties and regulated deficit irrigation strategies into national extension services.\u003c/p\u003e \u003cdiv id=\"Sec25\" class=\"Section2\"\u003e \u003ch2\u003e6.1 Limitations and Future Research\u003c/h2\u003e \u003cp\u003eThis study is limited to one season, one district, and 47 plots. Future research should: (a) extend the study to multiple seasons to capture inter-annual variability associated with ENSO cycles; (b) include soil moisture monitoring and salinity measurement to assess soil-related yield constraints; (c) conduct economic water productivity analysis (revenue per m\u0026sup3;) to guide crop-mix optimization; (d) integrate GIS and remote sensing to map irrigation efficiency at the basin scale; and (e) evaluate the cost-effectiveness of alternative irrigation technologies (drip, sprinkler) under Somali field conditions.\u003c/p\u003e "},{"header":"Declarations","content":"\u003ch2\u003eAuthor Contribution\u003c/h2\u003e\u003cp\u003eAuthor contributions are defined in accordance with the CRediT (Contributor Roles Taxonomy) framework.Mohamed Hassan Osman: Conceptualization; Methodology; Data curation; Formal analysis; Investigation; Writing \u0026ndash; Original Draft; Writing \u0026ndash; Review \u0026amp; Editing.Ahmed Mohamud Mohamed: Conceptualization; Supervision; Resources; Validation; Writing \u0026ndash; Review \u0026amp; Editing.All authors have read and agreed to the published version of the manuscript\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\u003cli\u003e\u003cspan\u003eAfshar, A., Afsharmanesh, G. R., Adeli, M., \u0026amp; Malekian, A. (2014). Assessment of AquaCrop model in the simulation of potato yield and water use efficiency under different water regimes. Journal of Biological and Environmental Science, 8(23), 79\u0026ndash;86.\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eAllen, R. G., Pereira, L. S., Raes, D., \u0026amp; Smith, M. (2021). Crop evapotranspiration: Guidelines for computing crop water requirements (2nd ed.). FAO Irrigation and Drainage Paper No. 56. Food and Agriculture Organization.\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eBasnyat, D. B. (2007). Water resources of Somalia. FAOSWALIM. Nairobi.\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eBoutraa, T. (2010). Improvement of water use efficiency in irrigated agriculture: A review. Journal of Agronomy, 9(1), 1\u0026ndash;8. https://doi.org/10.3923/ja.2010.1.8\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eDehghaniSanij, H., Yamamoto, T., \u0026amp; Rasiah, V. (2004). Assessment of evapotranspiration estimation models for use in semi-arid environments. Agricultural Water Management, 64(2), 91\u0026ndash;106. https://doi.org/10.1016/S0378-3774(03)00200-2\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eDuraktekin, G., \u0026Ccedil;olak, Y. B., Kuşvuran, K., Ak\u0026ccedil;a, H., Ataǧ, G. A., \u0026amp; \u0026Ccedil;eliktopuz, E. (2017). Effects of different irrigation levels on yield and water use efficiency of table grape under subsurface drip irrigation. Journal of Gaziosmanpaşa University Faculty of Agriculture, 34, 67\u0026ndash;72.\u003c sp;\u0026plusmn;\u0026thinsp;3.9\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c4\"\u003e \u003cp\u003e\u003cb\u003e624.5\u0026thinsp;\u0026plusmn;\u0026thinsp;19.3\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c5\"\u003e \u003cp\u003e\u003cb\u003e1,314.0\u0026thinsp;\u0026plusmn;\u0026thinsp;362.5\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c6\"\u003e \u003cp\u003e\u003cb\u003e1.97\u0026thinsp;\u0026plusmn;\u0026thinsp;0.01\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c7\"\u003e \u003cp\u003e\u003cb\u003e2.82\u0026thinsp;\u0026plusmn;\u0026thinsp;0.04\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c8\"\u003e \u003cp\u003e\u003cb\u003e1.41\u0026thinsp;\u0026plusmn;\u0026thinsp;0.32\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003ctfoot\u003e \u003ctr\u003e\u003ctd colspan=\"8\"\u003e\u003cem\u003eNote: Banana applied water variability (SD\u0026thinsp;=\u0026thinsp;362.5 mm) is large, reflecting highly inconsistent irrigation scheduling across farms. Field 45 received 2,160 mm \u0026mdash; 3.5\u0026times; the CROPWAT estimate.\u003c/em\u003e\u003c/td\u003e\u003c/tr\u003e \u003c/tfoot\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":false,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":true,"hideJournal":true,"highlight":"","institution":"","isAcceptedByJournal":false,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"water productivity, irrigation efficiency, CROPWAT, water use efficiency, climate-smart irrigation, food security, Somalia, semi-arid agriculture","lastPublishedDoi":"10.21203/rs.3.rs-9812786/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-9812786/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003ch2\u003eBackground\u003c/h2\u003e \u003cp\u003eAgricultural water productivity in Somalia is critically low, limiting food security under variable climatic conditions. Field-level data on water use efficiency (WUE) are scarce, constraining evidence-based irrigation policy.\u003c/p\u003e\u003ch2\u003eObjective\u003c/h2\u003e \u003cp\u003eThis study evaluated agricultural water productivity in the Afgoi irrigation district of the Lower Shabelle region, Somalia, for five economically important crops: maize, sorghum, sesame, tomato, and banana.\u003c/p\u003e\u003ch2\u003eMethods\u003c/h2\u003e \u003cp\u003eA field survey was conducted on 47 randomly selected farm plots between August and December 2021 (2\u0026deg;8\u0026prime;17\u0026Prime;N, 45\u0026deg;7\u0026prime;16\u0026Prime;E; elevation 83 m a.s.l.). Crop yields were obtained through structured farmer interviews; the volume of irrigation water applied was measured using flow meters attached to pump outlets. Seasonal crop evapotranspiration (ETc) and irrigation requirements were computed using the FAO CROPWAT 8.0 model with long-term climate data (1990\u0026ndash;2021). WUE and irrigation water use efficiency (IWUE) were calculated as yield per unit of ETc and per unit of applied irrigation water, respectively.\u003c/p\u003e\u003ch2\u003eKey Findings:\u003c/h2\u003e \u003cp\u003eMean yields ranged from 471.3 kg ha⁻\u0026sup1; (sesame) to 17,574.1 kg ha⁻\u0026sup1; (banana) well below FAO global benchmarks. Farmers over-applied irrigation water for maize, sesame, tomato, and banana (58\u0026ndash;127% above CROPWAT estimates), while sorghum was under-irrigated. WUE ranged from 0.14 (sesame) to 1.97 kg m⁻\u0026sup3; (banana); IWUE from 0.12 (sesame) to 1.40 kg m⁻\u0026sup3; (banana). All values fell substantially below international benchmarks, driven by uncontrolled surface irrigation, earthen-canal conveyance losses, and absent irrigation scheduling.\u003c/p\u003e\u003ch2\u003eConclusion\u003c/h2\u003e \u003cp\u003eDemand-driven pressurized irrigation, combined with farmer training and improved inputs, is needed to enhance water productivity and food security in Somalia. These findings establish an empirical baseline for irrigation policy reform.\u003c/p\u003e","manuscriptTitle":"Water Use Efficiency of Irrigated Crops in Afgoi, Somalia: A Field and CROPWAT Analysis","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-05-26 11:32:03","doi":"10.21203/rs.3.rs-9812786/v1","editorialEvents":[{"type":"communityComments","content":0}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"64ba8a26-5c67-496a-832d-3a7f630e762e","owner":[],"postedDate":"May 26th, 2026","published":true,"recentEditorialEvents":[],"rejectedJournal":[],"revision":"","amendment":"","status":"posted","subjectAreas":[],"tags":[],"updatedAt":"2026-05-29T15:40:12+00:00","versionOfRecord":[],"versionCreatedAt":"2026-05-26 11:32:03","video":"","vorDoi":"","vorDoiUrl":"","workflowStages":[]},"version":"v1","identity":"rs-9812786","journalConfig":"researchsquare"},"__N_SSP":true},"page":"/article/[identity]/[[...version]]","query":{"identity":"rs-9812786","version":["v1"]},"buildId":"re_ckhLnmML6MCF96OHNJ","isFallback":false,"isExperimentalCompile":false,"dynamicIds":[84888],"gssp":true,"scriptLoader":[]}</script><div hidden="" id="snipcart" data-api-key="ODA3NTlmNDUtYjRjNy00MzE2LTgzNmYtYjUwY2Y4MWFkOWRlNjM3MTQwMjI1MDM0NDU2MjEx"></div></body></html>
